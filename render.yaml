services:
  - type: web
    name: lawpilot-ai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_PROVIDER
        value: demo
      - key: GEMINI_API_KEY
        sync: false
      - key: HOST
        value: 0.0.0.0
